name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v, e.g. 0.1.3"
        required: true

permissions:
  contents: read

jobs:
  update-tap:
    if: |
      github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      TAP_REPO: askairo/homebrew-tap
      CASK_NAME: clicky
      APP_NAME: clicky
      APP_DESC: Cross-platform environment profile switcher for Spring Boot
      APP_HOMEPAGE: https://github.com/askairo/clicky
      MAC_ASSET_PATTERN: _aarch64.dmg

    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve macOS asset URL
        id: asset
        run: |
          release_json="$(curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ steps.version.outputs.version }}")"
          asset_url="$(echo "$release_json" | jq -r '.assets[] | select(.name | contains(env.MAC_ASSET_PATTERN)) | .browser_download_url' | head -n1)"
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "No macOS asset matched pattern: ${MAC_ASSET_PATTERN}" >&2
            exit 1
          fi
          echo "asset_url=${asset_url}" >> "$GITHUB_OUTPUT"

      - name: Download asset and hash
        id: digest
        run: |
          curl -sL "${{ steps.asset.outputs.asset_url }}" -o clicky-macos.dmg
          sha256="$(sha256sum clicky-macos.dmg | awk '{print $1}')"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Generate cask
        run: |
          chmod +x scripts/generate-homebrew-cask.sh
          scripts/generate-homebrew-cask.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.digest.outputs.sha256 }}" \
            "${{ steps.asset.outputs.asset_url }}" \
            "${APP_HOMEPAGE}" \
            "${APP_DESC}" \
            "${APP_NAME}" \
            "${CASK_NAME}" > clicky.rb

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask in tap repo
        run: |
          mkdir -p tap/Casks
          cp clicky.rb "tap/Casks/${CASK_NAME}.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes in cask, skip commit."
            exit 0
          fi
          git add "Casks/${CASK_NAME}.rb"
          git commit -m "chore: update ${CASK_NAME} to v${{ steps.version.outputs.version }}"
          git push
